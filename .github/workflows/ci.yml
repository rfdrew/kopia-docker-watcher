name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
      - uses: golangci/golangci-lint-action@v9
        with:
          version: v2.14.0

  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
      - run: go mod tidy -diff
      - run: go build ./...
      - run: go test -race ./...

  # Only the latest kopia release is supported; its image is pinned in
  # internal/kopiatest.DefaultImage.
  integration:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
      - run: make test-integration

  image:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: docker/setup-buildx-action@v4
      # Cross-compiled in the build stage; the final stage only copies, so
      # arm64 needs no emulation.
      - name: Build multi-arch image
        uses: docker/build-push-action@v7
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          build-args: VERSION=${{ github.sha }}
          push: false
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - name: Load amd64 image
        uses: docker/build-push-action@v7
        with:
          context: .
          build-args: VERSION=${{ github.sha }}
          load: true
          tags: kopia-docker-watcher:ci
          cache-from: type=gha
      - name: Smoke test
        run: |
          set -eux
          image=kopia-docker-watcher:ci
          test "$(docker run --rm "$image" version)" = "${{ github.sha }}"
          test "$(docker image inspect -f '{{.Config.User}}' "$image")" = "65532:65532"
          docker image inspect -f '{{json .Config.Healthcheck}}' "$image" | grep -q healthcheck
          # The state directory belongs to nonroot.
          ctr=$(docker create "$image")
          docker export "$ctr" | tar --numeric-owner -tvf - | grep -E '^d.* 65532/65532 .* var/lib/kopia-docker-watcher/?$'
          docker rm "$ctr"
          # /healthz answers inside the container; kopia server is not needed for it.
          docker run -d --name kdw -e KOPIA_SERVER_URL=http://127.0.0.1:1 -e KOPIA_SERVER_PASSWORD=x "$image"
          for i in $(seq 1 20); do
            docker exec kdw /usr/local/bin/kopia-docker-watcher healthcheck && ok=1 && break
            sleep 1
          done
          docker logs kdw
          test "${ok:-}" = 1
          docker stop kdw
          test "$(docker inspect -f '{{.State.ExitCode}}' kdw)" = 0

  # Dry run of the release: validates .goreleaser.yaml, cross-builds the
  # archives and builds the image from Dockerfile.goreleaser, so a broken
  # release config shows up before a tag is pushed. Nothing is published.
  release-snapshot:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
      - uses: docker/setup-buildx-action@v4
      - uses: goreleaser/goreleaser-action@v7
        with:
          distribution: goreleaser
          version: v2.18.3
          args: check
      - uses: goreleaser/goreleaser-action@v7
        with:
          distribution: goreleaser
          version: v2.18.3
          args: release --snapshot --clean
      - name: Smoke test
        run: |
          set -eux
          version=$(jq -r .version dist/metadata.json)
          image=ghcr.io/rfdrew/kopia-docker-watcher:${version}-amd64
          test "$(docker run --rm "$image" version)" = "v${version}"
          test "$(docker image inspect -f '{{.Config.User}}' "$image")" = "65532:65532"
          docker image inspect -f '{{json .Config.Healthcheck}}' "$image" | grep -q healthcheck
          test "$(docker image inspect -f '{{index .Config.Labels "org.opencontainers.image.licenses"}}' "$image")" = Apache-2.0
          ctr=$(docker create "$image")
          docker export "$ctr" | tar --numeric-owner -tvf - | grep -E '^d.* 65532/65532 .* var/lib/kopia-docker-watcher/?$'
          docker rm "$ctr"
          # The arm64 image exists too; it is not run without emulation.
          docker image inspect -f '{{.Architecture}}' "ghcr.io/rfdrew/kopia-docker-watcher:${version}-arm64" | grep -qx arm64
